name: Runtime checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.11.0
      - name: Bootstrap the missing dependency lock once
        if: ${{ hashFiles('pnpm-lock.yaml') == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git config user.name 'Runtime dependency bootstrap'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build: lock Runtime workspace dependencies'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test && pnpm build
      - name: Native domain and sanitizer tests
        run: |
          cmake --preset domain
          cmake --build --preset domain
          ctest --preset domain
          cmake --preset sanitizers
          cmake --build --preset sanitizers
          ctest --preset sanitizers
      - name: Start real local stack
        run: ./scripts/bootstrap.sh && ./scripts/dev-up.sh
      - name: HTTP, approval, and isolation tests
        run: ./scripts/test-integration.sh && ./scripts/test-security.sh
      - name: Browser verification
        run: pnpm exec playwright install --with-deps chromium && ./scripts/test-e2e.sh
      - name: Capture build and browser evidence
        if: always()
        run: |
          mkdir -p evidence/ci
          git rev-parse HEAD > evidence/ci/commit.txt
          docker compose --env-file .env -p runtime-local -f infra/compose.yaml ps > evidence/ci/services.txt 2>/dev/null || true
          docker compose --env-file .env -p runtime-local -f infra/compose.yaml logs --no-color > evidence/ci/services.log 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-check-evidence
          path: |
            evidence/ci
            evidence/screenshots
            playwright-report
            test-results
            pnpm-lock.yaml
      - if: always()
        run: docker compose --env-file .env -p runtime-local -f infra/compose.yaml down || true
