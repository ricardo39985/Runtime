name: Runtime application engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.11.0
      - run: pnpm install --frozen-lockfile
      - name: TypeScript, Svelte and provider contract tests
        run: pnpm check && pnpm test && pnpm build
      - name: Native engine and lossless storage tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libzstd-dev libssl-dev
          cmake --preset domain
          cmake --build --preset domain
          ctest --preset domain
          cmake --preset sanitizers
          cmake --build --preset sanitizers
          ctest --preset sanitizers
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cpp-cache
        with:
          path: /tmp/runtime-cpp-cache
          key: runtime-cpp-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'infra/docker/core.Dockerfile', 'infra/triplets/*') }}
          restore-keys: runtime-cpp-v2-${{ runner.os }}-
      - name: Build and cache pinned C++ dependencies
        id: cpp-deps
        run: |
          docker buildx create --name runtime-builder --driver docker-container --use
          CACHE=()
          if [[ -f /tmp/runtime-cpp-cache/index.json ]]; then CACHE+=(--cache-from type=local,src=/tmp/runtime-cpp-cache); fi
          docker buildx build --target cpp-deps -f infra/docker/core.Dockerfile "${CACHE[@]}" --cache-to type=local,dest=/tmp/runtime-cpp-cache-next,mode=max .
          rm -rf /tmp/runtime-cpp-cache
          mv /tmp/runtime-cpp-cache-next /tmp/runtime-cpp-cache
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ always() && steps.cpp-deps.outcome == 'success' && steps.cpp-cache.outputs.cache-hit != 'true' }}
        with:
          path: /tmp/runtime-cpp-cache
          key: ${{ steps.cpp-cache.outputs.cache-primary-key }}
      - name: Build real application services
        run: |
          docker buildx build --load --cache-from type=local,src=/tmp/runtime-cpp-cache -t runtime-local-core -f infra/docker/core.Dockerfile .
          docker buildx build --load -t runtime-local-bridge -f infra/docker/bridge.Dockerfile .
      - name: Start actual PostgreSQL and application services
        run: |
          ./scripts/bootstrap.sh
          docker compose --env-file .env -p runtime-local -f infra/compose.yaml up --no-build -d --wait --wait-timeout 120
      - name: Application API, customer isolation, compression and restart persistence
        run: ./scripts/test-integration.sh && ./scripts/test-security.sh
      - name: Real browser verification
        run: pnpm exec playwright install --with-deps chromium && ./scripts/test-e2e.sh
      - name: Capture redacted service evidence
        if: always()
        run: |
          mkdir -p evidence/ci
          git rev-parse HEAD > evidence/ci/commit.txt
          if [[ -f .env ]]; then
            docker compose --env-file .env -p runtime-local -f infra/compose.yaml ps > evidence/ci/services.txt 2>/dev/null || true
            docker compose --env-file .env -p runtime-local -f infra/compose.yaml logs --no-color > evidence/ci/services.log 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-application-engine-evidence
          path: |
            evidence/ci
            evidence/screenshots
            playwright-report
            test-results
      - if: always()
        run: if [[ -f .env ]]; then docker compose --env-file .env -p runtime-local -f infra/compose.yaml down; fi
