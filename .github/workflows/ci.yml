name: Runtime application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test && pnpm build
      - name: Install native-test dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-json-dev libssl-dev libzstd-dev
      - name: Domain, application, compression and sanitizer checks
        run: |
          cmake --preset domain
          cmake --build --preset domain --parallel 2
          ctest --preset domain
          cmake --preset sanitizers
          cmake --build --preset sanitizers --parallel 2
          ctest --preset sanitizers
      - name: Build and start actual local stack
        run: ./scripts/bootstrap.sh && ./scripts/dev-up.sh
      - name: Application API, isolation and actual restart
        run: ./scripts/test-integration.sh && ./scripts/test-security.sh && ./scripts/test-restart.sh
      - name: Browser and mobile verification
        run: pnpm exec playwright install --with-deps chromium && ./scripts/test-e2e.sh
      - name: Capture evidence
        if: always()
        run: |
          mkdir -p evidence/ci
          git rev-parse HEAD > evidence/ci/commit.txt
          docker compose --env-file .env -p runtime-local -f infra/compose.yaml ps > evidence/ci/services.txt 2>/dev/null || true
          docker compose --env-file .env -p runtime-local -f infra/compose.yaml logs --no-color > evidence/ci/services.log 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-application-evidence
          path: |
            evidence/ci
            evidence/screenshots
            playwright-report
            test-results
      - if: always()
        run: docker compose --env-file .env -p runtime-local -f infra/compose.yaml down || true
