name: Import verified application engine source
on:
  push:
    branches: [feat/general-application-engine]
    paths: ['.source-transfer/**', '.github/workflows/source-import.yml']
permissions:
  contents: write
concurrency:
  group: runtime-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/feat/general-application-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and materialize source files
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, os, shutil, subprocess
          root = Path.cwd().resolve()
          encoded = b''.join((root / f'.source-transfer/{i:02d}.b64').read_bytes() for i in range(6))
          assert len(encoded) == 69432, 'Transfer length mismatch'
          compressed = base64.b64decode(encoded, validate=True)
          assert len(compressed) == 52072, 'Compressed length mismatch'
          assert hashlib.sha256(compressed).hexdigest() == 'bd48d2f93ca35a5db450b81fe08f6402bceacd2439cd7676700c8775c18e17fb', 'Source digest mismatch'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          decoded = decoder.decompress(compressed, max_length=1024 * 1024)
          assert decoder.eof and not decoder.unused_data and len(decoded) == 222640, 'Invalid bounded archive'
          bundle = json.loads(decoded)
          assert set(bundle) == {'files'} and len(bundle['files']) == 42
          names = set()
          allowed_roots = {'apps','db','docs','evidence','examples','infra','packages','scripts','services','tests'}
          allowed_files = {'.env.example','AGENTS.md','CMakeLists.txt','README.md','vcpkg.json'}
          for item in bundle['files']:
              assert set(item) == {'path','content','mode'}
              name, content, mode = item['path'], item['content'], item['mode']
              assert isinstance(name, str) and isinstance(content, str) and mode in {'100644','100755'}
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and name == str(path)
              assert name in allowed_files or path.parts[0] in allowed_roots
              assert name not in names and len(content.encode()) < 128 * 1024
              destination = root / name
              assert root in destination.resolve().parents
              assert not destination.is_symlink()
              for parent in destination.parents:
                  if parent == root: break
                  assert not parent.is_symlink()
              names.add(name)
          for item in bundle['files']:
              destination = root / item['path']
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(item['content'], encoding='utf-8')
              destination.chmod(0o755 if item['mode'] == '100755' else 0o644)
          shutil.rmtree(root / '.source-transfer')
          subprocess.run(['git','add','--all','--',*sorted(names),'.source-transfer'],check=True)
          print('Verified and materialized 42 normal source files. No provider calls or deployment.')
          PY
      - name: Commit source to the existing feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/general-application-engine
          git config user.name 'Runtime source import'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement general application engine, pluggable abilities and lossless storage'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:feat/general-application-engine
